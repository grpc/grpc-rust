# To activate pre-commit hooks on your local machine:
# 1. Install pre-commit (e.g., `pip install pre-commit`, `brew install pre-commit`, or `apt install pre-commit`).
# 2. Run `pre-commit install` in the repository root to register the git hook.
# 3. (Optional) Run `pre-commit run --all-files` to verify all files manually.

repos:
  - repo: local
    hooks:
      - id: check-license
        name: Check license boilerplate in grpc subdirectory
        entry: python3 grpc/tools/check_license.py
        language: system
        types_or: [rust]
        files: ^grpc/
        pass_filenames: true
