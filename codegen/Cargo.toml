[package]
name = "codegen"
authors = ["Lucio Franco <luciofranco14@gmail.com>"]
license = "MIT"
edition = "2024"
rust-version = { workspace = true }

[dependencies]
protox = "0.9"
prettyplease = "0.2"
quote = "1"
syn = "2"
tempfile = "3.8.0"
tonic-prost-build = {path = "../tonic-prost-build", default-features = false, features = ["cleanup-markdown"]}
# xDS message codegen (Google protobuf-rust toolchain). Optional so the common
# `cargo run -p codegen` path stays light; enable with:
# `cargo run -p codegen --features xds`
protobuf-codegen = { version = "4.35.1-release", optional = true }
protobuf-well-known-types = { version = "4.35.1-release", optional = true }
protoc-gen-rust-grpc = { version = "0.10.0", path = "../protoc-gen-rust-grpc", optional = true }

[features]
default = []
# Regenerate the checked-in xDS message structs under grpc/src/generated/xds.
xds = ["dep:protobuf-codegen", "dep:protobuf-well-known-types", "dep:protoc-gen-rust-grpc"]
